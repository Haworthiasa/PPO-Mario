level: 2-3
seed: 1
device: auto
run_dir: runs/2-3/from-scratch-3m
resume: null
torch_threads: 6
checkpoint_every: 100000
eval_episodes: 5
eval_max_steps: 3000
video: true
env:
  actions: simple
  frame_skip: 4
  frame_stack: 4
  size: 84
  weights:
  - 1.0
  - 1.0
  - 2.0
  - 0.0
  - 0.0
  noop_max: 30
  normalize_reward: false
  max_no_progress_steps: 200
  flag_bonus: 2.0
model: {}
algo:
  num_envs: 8
  num_steps: 512
  num_minibatches: 16
  update_epochs: 10
  total_steps: 3000000
  lr: 0.0002
  anneal_lr: true
  adam_eps: 1.0e-05
  gamma: 0.9
  gae_lambda: 1.0
  clip_coef: 0.15
  clip_vloss: false
  norm_adv: true
  ent_coef: 0.01
  ent_coef_final: 0.002
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03
