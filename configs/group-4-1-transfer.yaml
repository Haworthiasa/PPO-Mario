# Cấu hình của nhóm cho màn thưởng 4-1 (học chuyển giao từ checkpoint 1-1 của chính nhóm).
# Thí nghiệm so sánh, KHÔNG phải cấu hình của checkpoint nộp (cấu hình nộp là configs/group-4-1.yaml).
# Chạy: python -m mario_ppo.train --config configs/group-4-1-transfer.yaml run_dir=runs/4-1/transfer
# Khác configs/group-1-1.yaml ở ba dòng: level, resume, total_steps.
level: "4-1"
seed: 1
device: auto
run_dir: null
# Khởi tạo từ checkpoint 1-1 ở 1.200.128 bước (sinh từ configs/group-1-1.yaml). `resume` của train.py nối tiếp cả
# trọng số, trạng thái Adam và bộ đếm bước, nên bộ đếm của lượt chạy 4-1 bắt đầu từ 1.200.128.
resume: runs/1-1/run-1/checkpoints/step_001200128.pt
torch_threads: 6
checkpoint_every: 100_000
eval_episodes: 5
eval_max_steps: 3000
video: true

env:
  actions: simple
  frame_skip: 4
  frame_stack: 4
  size: 84
  weights: [1.0, 1.0, 2.0, 0.0, 0.0]
  noop_max: 30
  normalize_reward: false
  # ---- mẹo huấn luyện của nhóm (chỉ chạy khi eval_mode=False) ----
  max_no_progress_steps: 200
  flag_bonus: 2.0

model: {}

algo:
  num_envs: 8
  num_steps: 512
  num_minibatches: 16
  update_epochs: 10
  # 1.200.128 bước đã dùng ở 1-1 + 5 triệu bước cho 4-1 (đề cho tối đa 10 triệu bước ở màn thưởng).
  # Tốc độ học giảm tuyến tính theo bộ đếm bước, nên ở đầu lượt chạy 4-1 nó bằng khoảng 81% của lr.
  total_steps: 6_200_000
  lr: 1.5e-4
  anneal_lr: true
  adam_eps: 1e-5
  gamma: 0.9
  gae_lambda: 1.0
  clip_coef: 0.15
  clip_vloss: false
  norm_adv: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03
