# Màn 1-3, lượt đầu (docs/optimize-1-1.md, Mục 15). KHÔNG phải bản nộp.
#
# Giống hệt configs/group-4-1-tuning.yaml, chỉ khác màn và số bước: 819.200 bước (200 lần cập nhật × 4.096,
# 8 checkpoint × 102.400), Dũng chốt 28/11. Cấu hình của lượt 4-1 "ít bước" (c1-e0-f1-g1) được thêm bằng các khóa
# ghi đè trên dòng lệnh (experiments/start_1-3.sh), ví dụ:
#   python -m mario_ppo.train_joint --config configs/group-1-3-tuning.yaml run_dir=runs/1-3/tuning/<lượt> <khóa ghi đè>
# Chưa có lượt cũ nào học 1-3; mạng chưa học 1-3 dừng ở x khoảng 300–750 (docs/inside-the-network.md, Mục 3.3).
levels: ["1-3"]
seed: 1
device: cuda
run_dir: null
resume: null
torch_threads: 6
checkpoint_every: 102_400
eval_episodes: 0
eval_max_steps: 3000
video: false

env:
  actions: simple
  frame_skip: 4
  frame_stack: 4
  size: 84
  weights: [1.0, 1.0, 2.0, 0.0, 0.0]
  noop_max: 30
  normalize_reward: false
  max_no_progress_steps: 200
  flag_bonus: 2.0

model: {}

algo:
  num_envs: 8
  num_steps: 512
  num_minibatches: 16
  update_epochs: 10
  total_steps: 819_200
  lr: 1.5e-4
  anneal_lr: true
  adam_eps: 1e-5
  gamma: 0.9
  gae_lambda: 1.0
  clip_coef: 0.15
  clip_vloss: false
  norm_adv: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03
