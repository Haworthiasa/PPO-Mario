# Cùng thiết lập lần chạy 500.000 bước với trọng số của thầy, dùng Nature-CNN rộng hơn.
level: "1-1"
seed: 2026
device: cpu
run_dir: runs/1-1-nature-1-7m-500k
resume: null
torch_threads: 2
checkpoint_every: 100000
eval_episodes: 5
eval_max_steps: 3000
video: false

env:
  actions: right_only
  frame_skip: 2
  frame_stack: 4
  size: 84
  weights: [1.0, 1.0, 2.0, 0.05, 0.05]
  noop_max: 30
  normalize_reward: true

model:
  channels: [32, 64, 64]
  hidden_size: 512

algo:
  num_envs: 8
  num_steps: 125
  num_minibatches: 4
  update_epochs: 4
  total_steps: 500000
  lr: 2.5e-4
  anneal_lr: true
  adam_eps: 1e-5
  gamma: 0.9
  gae_lambda: 0.95
  clip_coef: 0.2
  clip_vloss: false
  norm_adv: true
  ent_coef: 0.01
  vf_coef: 0.25
  max_grad_norm: 0.5
  target_kl: null
