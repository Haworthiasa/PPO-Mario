# Cấu hình của nhóm cho MỘT mạng học 8 màn cùng lúc, học TỪ ĐẦU, lịch 10 triệu bước tác tử.
# Chạy cả lượt:
#   python -m mario_ppo.train_joint --config configs/group-8-levels.yaml run_dir=runs/8-levels/from-scratch-10m
# Chạy đoạn đầu rồi dừng ở mốc kiểm tra 2 triệu bước (dừng thật ở 2.002.944, bội số đầu tiên của 4.096):
#   python -m mario_ppo.train_joint --config configs/group-8-levels.yaml run_dir=runs/8-levels/from-scratch-10m \
#       stop_at_step=2000000
# Chạy tiếp từ mốc đó, vẫn theo lịch 10 triệu bước. Đoạn 2M -> 10M đã chạy (2026-11-23) bật dồn bước theo tỉ lệ
# trượt (mục 5 ở đầu train_joint.py) và tắt chấm trong lúc huấn luyện, chấm sau bằng mario_ppo.evaluate:
#   python -m mario_ppo.train_joint --config configs/group-8-levels.yaml run_dir=runs/8-levels/from-scratch-10m \
#       resume=runs/8-levels/from-scratch-10m/checkpoints/step_002002944.pt \
#       allocation.floor=0.06 allocation.cap=0.30 eval_episodes=0 video=false
#
# Dùng mario_ppo/train_joint.py (tệp thêm của nhóm). 8 môi trường, mỗi môi trường một màn, nên mỗi lần cập nhật PPO
# có 512 bước của mỗi màn và mỗi màn nhận 1/8 số bước (250 nghìn bước ở mốc 2 triệu). Từ mốc 2 triệu, khi bật
# `allocation`, mỗi môi trường đổi màn theo lượt chơi và số bước của từng màn ghi trong allocation.csv.
# Giống hệt configs/group-1-1-and-4-1.yaml (99/100 ở cả 1-1 và 4-1), chỉ khác `levels` và total_steps.
#
# Vì sao là 8 màn này: 1-1 và 4-1 đã biết học được; 3-2, 6-1, 2-1, 5-1, 3-1 là các màn tiến nhanh nhất trong lượt
# thử nối tiếp (runs/multi-level/restart-test); 5-2 thay cho 8-1 vì 8-1 dài 6009 (gần gấp đôi các màn khác, xem
# runs/level-lengths/level-lengths.csv) nên mỗi lượt chơi tốn gấp đôi bước. 5-2 chưa có số đo học nào.
levels: ["1-1", "2-1", "3-1", "3-2", "4-1", "5-1", "5-2", "6-1"]
seed: 1
device: auto
run_dir: null
resume: null
torch_threads: 6
checkpoint_every: 100_000
eval_episodes: 5
eval_max_steps: 3000
video: true

env:
  actions: simple
  frame_skip: 4
  frame_stack: 4
  size: 84
  weights: [1.0, 1.0, 2.0, 0.0, 0.0]
  noop_max: 30
  normalize_reward: false
  # ---- mẹo huấn luyện của nhóm (chỉ chạy khi eval_mode=False) ----
  max_no_progress_steps: 200
  flag_bonus: 2.0

model: {}

algo:
  num_envs: 8
  num_steps: 512
  num_minibatches: 16
  update_epochs: 10
  # 2.441 đoạn thu x 4.096 bước = 9.998.336: bội số lớn nhất của 4.096 không vượt trần 10 triệu bước của nhóm.
  # Tốc độ học và hệ số entropy giảm tuyến tính theo con số này, kể cả khi lượt chạy dừng sớm bằng stop_at_step.
  total_steps: 9_998_336
  lr: 2.0e-4
  anneal_lr: true
  adam_eps: 1e-5
  gamma: 0.9
  gae_lambda: 1.0
  clip_coef: 0.15
  clip_vloss: false
  norm_adv: true
  # Hệ số entropy giảm tuyến tính 0.01 -> 0.002 theo total_steps (ppo.py, khóa ent_coef_final của nhóm).
  ent_coef: 0.01
  ent_coef_final: 0.002
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03
